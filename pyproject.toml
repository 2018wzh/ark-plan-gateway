[project]
name = "ark-plan-gateway"
version = "0.10.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=14,<17", "httpx>=0.27,<1", "anyio>=4,<5", "cryptography>=43,<47", "python-dotenv>=1,<2", "volcengine>=1.0.228,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]
